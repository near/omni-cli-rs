[package]
name = "omni-cli-rs"
version = "0.1.0"
edition = "2024"
description = "omni is your human-friendly companion that helps to control accounts on other chains from NEAR (DAO + MPC chain signatures) from command line."
license = "MIT OR Apache-2.0"
homepage = "https://omni-cli-rs.github.io"
repository = "https://github.com/near/omni-cli-rs"

[[bin]]
name = "omni"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0.18", features = ["derive"] }
inquire = "0.9.3"
strum = { version = "0.24", features = ["derive"] }
strum_macros = "0.24"

tokio = { version = "1.0", features = ["rt-multi-thread"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.57"
toml = "0.8"
base64 = "0.23"
hex = "0.4"

shell-words = "1.0.0"
# Same version near-cli-rs uses, so the tree carries one copy.
prettytable = "0.10"
color-eyre = "0.6"
dirs = "7"

reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "query",
    "rustls",
    "webpki-roots",
] }

near-api = "0.8.6"
near-crypto = "0.37"
near-primitives = "0.37"
near-gas = "0.3"
near-token = { version = "0.3", features = [
    "serde",
    "borsh",
    "interactive-clap",
] }

interactive-clap = "0.3"
interactive-clap-derive = "0.3"

near-cli-rs = { version = "0.30", default-features = false }

omni-transaction = { version = "0.5.0", default-features = false, features = [
    "evm",
    "solana",
    "aptos",
    "sui",
    "bitcoin",
    "ton",
    "serde_json",
] }
sha3 = "0.12"
sha2 = "0.11"
ripemd = "0.2"
bech32 = "0.12"
bs58 = "0.5"
# Runtime secp256k1 verification: maps MPC signatures to the UTXO inputs they
# sign (receipt order is not guaranteed to match sign-action order).
k256 = { version = "0.14", features = ["ecdsa"] }

# Local-only ABI encoding for `function-signature` calldata input (cast-style),
# and keccak256 / checksummed address formatting. Encoding only - no RPC stack.
alloy-primitives = "1"
alloy-dyn-abi = "1"

# `omni self-update`: swaps the running binary for the latest GitHub release.
# TLS comes from the reqwest rustls features above (feature unification).
self_update = { version = "1.3.0", default-features = false, features = [
    "github",
    "reqwest",
] }

[dev-dependencies]
k256 = { version = "0.14", features = ["ecdsa"] }
ed25519-dalek = "3"

# The profile that 'dist' will build with.
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'dist' (cargo-dist): builds cross-platform release archives and
# installers on a version tag, and uploads them to a GitHub Release. Keep
# .github/workflows/release.yml in sync by regenerating it with `dist init`
# whenever this block changes.
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax).
cargo-dist-version = "0.32.0"
# Let CI regenerate/patch the release workflow without a dirty-tree error.
allow-dirty = ["ci"]
# CI backends to support.
ci = "github"
# The installers to generate for each app (shell for unix, powershell for
# windows). No npm/msi: this is a developer CLI, not an npm package.
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax).
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Both archive formats are .tar.gz so `self-update` can unpack every platform.
windows-archive = ".tar.gz"
unix-archive = ".tar.gz"
# On PRs, only run `dist plan` (a cheap sanity check) - don't build artifacts.
pr-run-mode = "plan"
# Installers place the binary in CARGO_HOME (~/.cargo/bin), on PATH already.
install-path = "CARGO_HOME"
# We ship our own `omni self-update`, so no separate updater program.
install-updater = false

[workspace.metadata.dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
x86_64-unknown-linux-gnu = "ubuntu-22.04"
x86_64-pc-windows-msvc = "windows-2022"
x86_64-apple-darwin = "macos-15-intel"
aarch64-apple-darwin = "macos-14"

